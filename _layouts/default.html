<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
</head>
<body>
    <div class="page-shell">
        <header class="site-nav-wrap">
            <nav class="site-nav" aria-label="Main navigation">
                <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
                <div class="site-nav__links">
                    <a href="{{ '/' | relative_url }}">Home</a>
                    <a href="{{ '/blog/' | relative_url }}">Blog</a>
                    <a href="{{ '/profile/' | relative_url }}">Profile</a>
                </div>
            </nav>
        </header>

        {{ content }}

        <footer class="site-footer">
            <p>&copy; {{ "now" | date: "%Y" }} {{ site.title }}</p>
        </footer>
    </div>
</body>
</html>
