---
layout: default
---
<main class="page-main page-main--narrow">
    <article class="post-content">
        <header class="post-header card">
            <p class="section__label">Blog Post</p>
            <h1>{{ page.title }}</h1>
            <p class="post-meta">{{ page.date | date: "%B %d, %Y" }}</p>
            {% if page.excerpt %}
            <p>{{ page.excerpt }}</p>
            {% endif %}
        </header>

        <div class="card prose">
            {{ content }}
        </div>
    </article>
</main>
